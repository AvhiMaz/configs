set -g prefix C-s
unbind C-k
bind C-s send-prefix

set -g status-position top
set -g status-interval 15

set -g status-left ""

set -g status-right "#[fg=#3c3836,bg=#1d2021]#[fg=#bdae93,bg=#3c3836] 󰋊 #(df -H / | awk 'NR==2 {print $4\" / \"$2}') "

set-window-option -g window-status-current-style "fg=#83a598,bg=#504945"
set-window-option -g window-status-current-format "#[fg=#1d2021,bg=#504945]#[fg=#83a598,bg=#504945,bold] #I:#W #[fg=#504945,bg=#1d2021]"

set-option -g display-panes-active-colour "#83a598"
